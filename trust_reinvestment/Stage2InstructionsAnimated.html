<style>
    :root{--ink:#0d1215;--stage:#232a33;--panel:#313d46;--line:#536473;--blue:#74b9f5;--orange:#ffad58;--green:#61cf93;--pink:#f486b2;--purple:#9b83ea;--yellow:#ffd166;--white:#f7f9fb}
    html,body{width:100%;min-height:100%;margin:0!important;background:var(--ink)!important}
    body>.container,.otree-body.container,.otree-body,main.container{max-width:none!important;width:100%!important;min-height:100vh!important;margin:0!important;padding:0!important;background:var(--ink)!important}.otree-title,.page-header{display:none!important}
    .p2-shell{color:var(--white);font-family:Inter,Arial,sans-serif;background:var(--ink);min-height:100vh;border-radius:0;overflow:hidden}
    .p2-head{height:74px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:2px solid #252e35}
    .p2-pill{background:var(--blue);color:#102131;border-radius:28px;padding:12px 26px;font-size:23px;font-weight:900;letter-spacing:.04em}
    .p2-title{font-size:27px;font-weight:850;flex:1}.p2-count{font-size:18px;font-weight:800;color:#cbd4db}
    .p2-stage{position:relative;height:445px;margin:18px 24px 74px;background:var(--stage);border-radius:24px;overflow:hidden}
    .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;animation:sceneIn .42s ease both}
    .sentence-wrap{position:relative;min-height:154px;margin:0 42px}
    .sentence{min-height:104px;margin:0;background:var(--panel);border-radius:20px;border-left:10px solid var(--blue);display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:flex-start;text-align:center;padding:18px 34px;font-size:25px;line-height:1.35;font-weight:900}
    .settled-line{font-size:25px;line-height:1.35;font-weight:900;text-align:center;margin:3px 0}
    .active-sentence{position:absolute;z-index:20;left:4%;right:4%;top:-24px;transform:translateY(-50%);font-size:31px;line-height:1.35;font-weight:950;text-align:center;opacity:0;filter:drop-shadow(0 3px 9px #000);transition:top .72s ease,transform .72s ease,font-size .72s ease,opacity .35s ease;pointer-events:none}
    .active-sentence.show{opacity:1}.active-sentence.drop{font-size:25px;filter:none}
    .value-blue{color:var(--blue);font-weight:950}
    .controls{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin:18px 38px 4px}.ctrl{min-width:166px;border-radius:15px;padding:16px 25px;border:3px solid #6c7a86;background:#36424c;color:var(--white);font-size:22px;font-weight:900}.ctrl.primary{background:var(--blue);border-color:var(--blue);color:#102131}.ctrl:disabled{opacity:.28}.otree-btn-next{display:none!important}
    .people{width:100%;display:flex;align-items:center;justify-content:center;gap:150px}.person-wrap{text-align:center;position:relative}.person{width:130px;height:180px;position:relative;margin:auto}.person:before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;left:34px;top:0;background:var(--pc);border:4px solid #dbe7ee}.person:after{content:"";position:absolute;width:112px;height:105px;border-radius:28px;left:9px;top:75px;background:var(--pc)}.person-label{font-size:21px;font-weight:900;margin-top:12px}.p1{--pc:var(--blue)}.p2{--pc:var(--orange)}
    .assigned .person{filter:drop-shadow(0 0 18px var(--yellow));transform:scale(1.08)}.assigned-tag{position:absolute;top:-58px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#182027;border-radius:16px;padding:7px 14px;font-size:15px;font-weight:950;white-space:nowrap}
    .fixed-link{width:190px;height:7px;background:var(--yellow);border-radius:10px;position:relative}.fixed-link:after{content:"SAME PARTNER";position:absolute;left:50%;top:-35px;transform:translateX(-50%);white-space:nowrap;color:var(--yellow);font-size:18px;font-weight:950}
    .pile-label{text-align:center;margin-top:7px;font-weight:900;font-size:19px}.blue-pile{--pile:var(--blue)}.orange-pile{--pile:var(--orange)}.pink-pile{--pile:var(--pink)}.purple-pile{--pile:var(--purple)}.green-pile{--pile:var(--green)}.yellow-pile{--pile:var(--yellow)}
    .ten-pile{position:relative;width:132px;height:80px;margin:0 auto}.ten-coin{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pile);border:3px solid #dbe7ee;box-sizing:border-box;box-shadow:0 2px 5px #0005}.ten-coin:nth-child(1){left:55px;top:0}.ten-coin:nth-child(2){left:44px;top:19px}.ten-coin:nth-child(3){left:66px;top:19px}.ten-coin:nth-child(4){left:33px;top:38px}.ten-coin:nth-child(5){left:55px;top:38px}.ten-coin:nth-child(6){left:77px;top:38px}.ten-coin:nth-child(7){left:22px;top:57px}.ten-coin:nth-child(8){left:44px;top:57px}.ten-coin:nth-child(9){left:66px;top:57px}.ten-coin:nth-child(10){left:88px;top:57px}
    .abstract-pile{position:relative;width:106px;height:86px;margin:auto;filter:drop-shadow(0 5px 9px #0005)}.abstract-pile:after{content:"";position:absolute;left:19px;right:19px;bottom:8px;height:15px;border-radius:50%;background:#0d1215;opacity:.22}.fuzzy-coin{position:absolute;width:45px;height:45px;border-radius:50%;background:var(--pile);border:3px solid #a6b0b8;box-sizing:border-box}.fuzzy-coin:nth-child(1){left:30px;top:3px;z-index:2}.fuzzy-coin:nth-child(2){left:8px;top:37px;z-index:1}.fuzzy-coin:nth-child(3){left:52px;top:37px;z-index:1}
    .multi-pile-wrap{text-align:center}.multi-piles{display:flex;gap:2px}.multi-piles .abstract-pile{transform:scale(.72);margin:0 -11px}
    .mechanic{display:flex;align-items:center;justify-content:center;gap:44px;width:100%}.endowment-mechanic{justify-content:space-between;padding:0 9%;box-sizing:border-box}.endowment-p1-group{display:flex;align-items:center;gap:24px}.reinvest-flow{gap:30px}.funding-sources{display:flex;align-items:center;gap:16px;padding:18px 20px;border:3px solid #536473;border-radius:22px;background:#29343c}.funding-caption{text-align:center;color:var(--white);font-size:18px;font-weight:950;margin-bottom:9px}.flow-step{display:flex;flex-direction:column;align-items:center}.flow-label{font-size:16px;font-weight:950;color:var(--yellow);margin-bottom:10px}.flow-arrow{width:76px;height:6px;border-radius:8px;background:var(--pink);position:relative}.flow-arrow:after{content:"";position:absolute;right:-1px;top:-6px;border-left:13px solid var(--pink);border-top:9px solid transparent;border-bottom:9px solid transparent}.operator{font-size:62px;font-weight:950;color:var(--yellow)}.arrow{width:170px;height:8px;border-radius:8px;background:var(--pink);position:relative}.arrow:after{content:"";position:absolute;right:-2px;top:-10px;border-left:24px solid var(--pink);border-top:14px solid transparent;border-bottom:14px solid transparent}
    .return-mechanic{gap:12px}.return-flow{position:relative;width:470px;height:145px}.return-received{position:absolute;right:0;top:25px}.return-moving{position:absolute;left:0;top:25px;width:90px;text-align:center;animation:returnFromReceived 2.15s ease both}.return-moving .abstract-pile{transform:scale(.72);transform-origin:center bottom}.return-moving .pile-label{margin-top:-3px}.return-mechanic>.p2{margin-left:58px}
    .account{min-width:250px;border:4px solid var(--green);border-radius:22px;padding:26px;text-align:center;background:#29343c}.account-title{color:var(--green);font-size:22px;font-weight:950}.account-balance{font-size:46px;font-weight:950;margin-top:9px}.lock{font-size:66px}.new-badge{position:absolute;top:26px;right:28px;background:var(--yellow);color:#172028;border-radius:18px;padding:9px 16px;font-size:16px;font-weight:950}
    .rounds{display:flex;flex-direction:column;align-items:center;gap:34px}.round-row{display:flex;gap:17px}.round-dot{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#102131;font-size:25px;font-weight:950;animation:pop .45s ease both}.round-dot:nth-child(2){animation-delay:.08s}.round-dot:nth-child(3){animation-delay:.16s}.round-dot:nth-child(4){animation-delay:.24s}.round-dot:nth-child(5){animation-delay:.32s}.chance-row{display:flex;gap:30px}.chance{border:3px solid var(--line);border-radius:18px;padding:18px 30px;text-align:center;font-weight:950;font-size:24px}.chance.stop{border-color:var(--pink)}.chance.go{border-color:var(--green)}
    .noise-grid{display:flex;gap:24px}.noise-card{width:210px;border:4px solid var(--line);border-radius:22px;text-align:center;padding:24px 15px;background:#29343c;animation:pop .5s ease both}.noise-card:nth-child(2){animation-delay:.12s}.noise-card:nth-child(3){animation-delay:.24s}.noise-factor{font-size:55px;color:var(--yellow);font-weight:950}.noise-prob{font-size:25px;font-weight:950}.only-p1{position:absolute;bottom:34px;background:var(--blue);color:#102131;padding:13px 24px;border-radius:18px;font-size:20px;font-weight:950}
    .payoff-grid{display:grid;grid-template-columns:1fr 1fr;gap:65px;width:90%}.payoff-card{display:flex;flex-direction:column;align-items:center;gap:18px}.formula{font-size:27px;font-weight:950;white-space:nowrap}.payoff-piles{display:flex;align-items:center;gap:18px}.small-pile{transform:scale(.76);margin:-8px -6px}.rate-card{border:4px solid var(--yellow);border-radius:25px;padding:38px 54px;text-align:center;background:#29343c}.rate-main{font-size:45px;font-weight:950;color:var(--yellow)}.rate-sub{font-size:22px;font-weight:900;margin-top:16px}.ready{font-size:56px;font-weight:950;color:var(--yellow);text-align:center}.subready{font-size:24px;font-weight:900;text-align:center;margin-top:22px}
    .move-right{animation:moveRight 1.05s ease both}.grow{animation:grow .9s ease both}.split-left{animation:splitLeft 1s ease both}.split-right{animation:splitRight 1s ease both}.drop-account{animation:dropAccount 1s ease both}.send-from-sources{animation:sendFromSources 1.35s .55s ease both}
    @keyframes sceneIn{from{opacity:0}to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes moveRight{from{transform:translateX(-170px);opacity:.2}to{transform:none;opacity:1}}@keyframes sendFromSources{0%{transform:translateX(-165px) scale(.08);opacity:0}35%{transform:translateX(-165px) scale(1);opacity:1}100%{transform:translateX(0) scale(1);opacity:1}}@keyframes grow{from{transform:scale(.25);opacity:.2}to{transform:scale(1);opacity:1}}@keyframes splitLeft{from{transform:translateX(95px)}to{transform:none}}@keyframes splitRight{from{transform:translateX(-95px)}to{transform:none}}@keyframes dropAccount{from{transform:translateY(-80px);opacity:.2}to{transform:none;opacity:1}}@keyframes returnFromReceived{0%,25%{opacity:0;transform:translateX(385px) scale(.18)}45%{opacity:1;transform:translateX(385px) scale(.88)}100%{opacity:1;transform:none}}
    @media(max-width:850px){.p2-stage{height:420px;margin-bottom:64px}.people{gap:45px}.fixed-link{width:90px}.sentence-wrap{margin:0 14px}.sentence,.settled-line{font-size:20px}.active-sentence{top:-18px;font-size:25px}.active-sentence.drop{font-size:20px}.mechanic{gap:18px;transform:scale(.78)}.endowment-mechanic{padding:0 2%;transform:scale(.82)}.endowment-p1-group{gap:10px}.reinvest-flow{transform:scale(.64);gap:18px}.funding-sources{gap:8px;padding:14px 12px}.flow-arrow{width:48px}.payoff-grid{gap:16px;transform:scale(.72)}.noise-grid{transform:scale(.72)}.p2-title{font-size:21px}.ctrl{min-width:125px}}
</style>

<div class="p2-shell" id="p2-shell"
     data-reinvestment="{{ is_reinvestment }}"
     data-noise="{{ has_noise }}"
     data-role="{{ role_number }}"
     data-min-rounds="{{ min_rounds }}"
     data-stop="{{ stopping_probability }}"
     data-continue="{{ continue_probability }}"
     data-p1-rate="{{ part1_rate }}"
     data-p2-rate="{{ part2_rate }}">
    <div class="p2-head">
        <div class="p2-pill">PART 2</div>
        <div class="p2-title" id="scene-title">Part 2 Game Rules</div>
        <div class="p2-count" id="scene-count"></div>
    </div>
    <div class="p2-stage" id="scene-stage"></div>
    <div class="sentence-wrap">
        <div class="sentence" id="scene-sentence"></div>
        <div class="active-sentence" id="active-sentence"></div>
    </div>
    <div class="controls">
        <button type="button" class="ctrl" id="prev-step">Previous</button>
        <button type="button" class="ctrl primary" id="next-step">Next</button>
    </div>
</div>
{{ next_button }}

<script>
(function(){
    const shell=document.getElementById('p2-shell');
    const reinvest=shell.dataset.reinvestment.toLowerCase()==='true';
    const noise=shell.dataset.noise.toLowerCase()==='true';
    const role=Number(shell.dataset.role||1);
    const minRounds=shell.dataset.minRounds;
    const stop=shell.dataset.stop;
    const cont=shell.dataset.continue;
    const p1Rate=shell.dataset.p1Rate;
    const p2Rate=shell.dataset.p2Rate;

    function person(n,assigned=false){return `<div class="person-wrap p${n} ${assigned?'assigned':''}">${assigned?'<div class="assigned-tag">YOUR ASSIGNED ROLE</div>':''}<div class="person"></div><div class="person-label">Player ${n}</div></div>`}
    function fuzzyDots(){return '<i class="fuzzy-coin"></i>'.repeat(3)}
    function pile(color,label,extra=''){return `<div class="${extra}"><div class="abstract-pile ${color}-pile">${fuzzyDots()}</div><div class="pile-label">${label}</div></div>`}
    function pileOnly(color,extra=''){return `<div class="abstract-pile ${color}-pile ${extra}">${fuzzyDots()}</div>`}
    function tenPile(color,label,extra=''){return `<div class="${extra}"><div class="ten-pile ${color}-pile">${'<i class="ten-coin"></i>'.repeat(10)}</div><div class="pile-label">${label}</div></div>`}
    function triplePile(color,label,extra=''){return `<div class="multi-pile-wrap"><div class="multi-piles">${pileOnly(color,extra)}${pileOnly(color,extra)}${pileOnly(color,extra)}</div><div class="pile-label">${label}</div></div>`}
    function people(link=false){return `<div class="people">${person(1,role===1)}${link?'<div class="fixed-link"></div>':''}${person(2,role===2)}</div>`}
    const scenes=[];
    scenes.push({title:'Your role and matched participant',visual:people(true),text:['There are still two roles in this game: Player 1 and Player 2.',`You remain Player ${role}.`,'You remain matched with the same participant.']});
    scenes.push({title:'How long Part 2 lasts',visual:`<div class="rounds"><div class="round-row">${[1,2,3,4,5].map(n=>`<div class="round-dot">${n}</div>`).join('')}</div><div class="chance-row"><div class="chance go">${cont}%<br>continue</div><div class="chance stop">${stop}%<br>end</div></div></div>`,text:[`Part 2 lasts for at least ${minRounds} rounds.`,`After each round from Round ${minRounds} onward, the game continues with an ${cont}% probability and ends with a ${stop}% probability.`]});
    scenes.push({title:'Your accumulated Part 2 account',visual:`<div class="mechanic">${pile('green','previous balance','split-left')}<div class="operator">+</div>${pile('yellow','round earnings','split-right')}<div class="operator">=</div><div class="account drop-account"><div class="account-title">PART 2 ACCOUNT</div><div class="account-balance">new balance</div></div></div>`,text:['Your earnings from every round are added to your accumulated Part 2 account.','Your Part 2 payoff is equal to the final balance in your accumulated Part 2 account.','Your Part 1 payoff is recorded separately and is not included in your accumulated Part 2 account.']});
    scenes.push({title:'An endowment each round',visual:`<div class="mechanic endowment-mechanic"><div class="endowment-p1-group">${person(1)}${tenPile('blue','10-point endowment','grow')}</div>${person(2)}</div>`,text:['At the start of <span class="value-blue">every round</span>, Player 1 receives a 10-point endowment.','Player 2 receives no endowment.']});
    if(reinvest){
        scenes.push({title:'Sending in Part 2',visual:`<div class="new-badge">DIFFERENT FROM PART 1</div><div class="mechanic reinvest-flow">${person(1)}<div><div class="funding-caption">Player 1 chooses a whole number from 0 up to the total available amount</div><div class="funding-sources">${tenPile('blue','current endowment','split-left')}<div class="operator">+</div>${pile('green','accumulated account','split-right')}</div></div><div class="flow-step"><div class="flow-arrow"></div></div>${pile('pink','amount sent','send-from-sources')}<div class="flow-arrow"></div>${person(2)}</div>`,text:'The total available amount equals the current 10-point endowment plus the balance in the accumulated Part 2 account.'});
    }else{
        scenes.push({title:'Sending in each round',visual:`<div class="mechanic">${person(1)}${pile('blue','0–10 points','move-right')}<div class="arrow"></div>${person(2)}</div>`,text:'Player 1 chooses a whole number from 0 to 10 to send. The accumulated Part 2 account cannot be sent.'});
    }
    scenes.push({title:'Player 2 receives three times the amount sent',visual:`<div class="mechanic">${pile('pink','amount sent')}<div class="operator">× 3</div>${triplePile('orange','received','move-right')}${person(2)}</div>`,text:'Player 2 receives three times the amount Player 1 sent.'});
    scenes.push({title:'Player 2 chooses a return',visual:`<div class="mechanic return-mechanic">${person(1)}<div class="return-flow"><div class="return-moving">${pile('purple','returned')}</div><div class="return-received">${triplePile('orange','received')}</div></div>${person(2)}</div>`,text:'Player 2 chooses a whole-number amount to return, from 0 up to the amount Player 2 received.'});
    if(noise){
        scenes.push({title:'Computer adjustment',visual:`<div class="mechanic">${person(1)}${pile('purple','chosen return')}<div class="noise-grid"><div class="noise-card"><div class="noise-factor">× 0</div><div class="noise-prob">20%</div></div><div class="noise-card"><div class="noise-factor">× 1</div><div class="noise-prob">60%</div></div><div class="noise-card"><div class="noise-factor">× 2</div><div class="noise-prob">20%</div></div></div></div>`,text:['The computer randomly changes how many of the returned points reach Player 1.','20% chance: Player 1 receives no returned points.','60% chance: Player 1 receives exactly the amount Player 2 returned.','20% chance: Player 1 receives twice the amount Player 2 returned.']});
        scenes.push({title:'Who is affected by the adjustment?',visual:`<div class="people">${person(1,true)}<div class="account"><div class="account-title">REALIZED RETURN</div><div class="account-balance">return × factor</div></div>${person(2,false)}</div>`,text:['The adjustment changes only Player 1’s realized return and payoff.','It never changes Player 2’s payoff.','With ×2, the amount reaching Player 1 may exceed the amount Player 2 received.']});
        scenes.push({title:'What Player 1 observes',visual:`<div class="mechanic">${person(1)}${pile('purple','amount received','grow')}<div class="operator">?</div>${pile('purple','chosen return')}${person(2)}</div>`,text:'Player 1 sees only the amount received—not Player 2’s chosen return or the computer multiplier.'});
    }
    scenes.push({title:'Round payoff',visual:`<div class="payoff-grid"><div class="payoff-card">${person(1)}<div class="payoff-piles">${pile('blue','kept','small-pile')}<div class="operator">+</div>${pile('purple',noise?'realized return':'returned','small-pile')}</div><div class="formula">Kept + ${noise?'realized return':'returned'}</div></div><div class="payoff-card">${person(2)}<div class="payoff-piles">${pile('orange','received','small-pile')}<div class="operator">−</div>${pile('purple','returned','small-pile')}</div><div class="formula">Received − returned</div></div></div>`,text:[`Player 1’s round payoff equals the points kept plus the ${noise?'realized return after the computer adjustment':'points returned'}.`,'Player 2’s round payoff equals the points received minus the points returned.']});
    if(!reinvest){
        scenes.push({title:'The account is protected',visual:`<div class="mechanic"><div class="lock">🔒</div><div class="account"><div class="account-title">PART 2 ACCOUNT</div><div class="account-balance">accumulates</div></div></div>`,text:'Your accumulated Part 2 account determines payment, but it cannot be used for later sends.'});
    }
    scenes.push({title:'Ready for the understanding test',visual:`<div><div class="ready">Part 2 rules complete</div><div class="subready">You must pass the understanding test before making payoff-relevant choices.</div></div>`,text:'Select “Start understanding test” when you are ready.'});

    let index=0,timer=null,lineIndex=0,currentLines=[],settledCurrent=false;
    const stage=document.getElementById('scene-stage'), sentence=document.getElementById('scene-sentence'), active=document.getElementById('active-sentence'), title=document.getElementById('scene-title'), count=document.getElementById('scene-count'), prev=document.getElementById('prev-step'), next=document.getElementById('next-step');
    function sceneLines(){const text=scenes[index].text;return Array.isArray(text)?text:[text]}
    function setSettled(lines){sentence.innerHTML=lines.map(line=>`<div class="settled-line">${line}</div>`).join('')}
    function readingTime(text){return Math.min(11000,Math.max(4600,2500+text.replace(/<[^>]+>/g,'').length*42))}
    function showNextLine(){
        const lines=sceneLines();
        active.className='active-sentence';
        active.innerHTML=lines[lineIndex];
        void active.offsetWidth;
        requestAnimationFrame(()=>active.classList.add('show'));
        timer=setTimeout(finishLine,readingTime(lines[lineIndex]));
    }
    function finishLine(){
        active.style.top=`${18+lineIndex*38}px`;
        active.classList.add('drop');
        timer=setTimeout(()=>{
            currentLines.push(sceneLines()[lineIndex]);
            setSettled(currentLines);
            active.className='active-sentence';
            active.style.top='';
            active.innerHTML='';
            lineIndex+=1;
            if(lineIndex<sceneLines().length){timer=setTimeout(showNextLine,500);return}
            settledCurrent=true;
            next.disabled=false;
            prev.disabled=index===0;
        },760);
    }
    function render(animate=true){
        clearTimeout(timer);
        const s=scenes[index];
        lineIndex=0;
        currentLines=[];
        settledCurrent=!animate;
        title.textContent='Part 2 Game Rules';
        count.textContent=`Instruction ${index+1} of ${scenes.length}`;
        stage.innerHTML=`<div class="scene">${s.visual}</div>`;
        active.className='active-sentence';
        active.style.top='';
        active.innerHTML='';
        setSettled(animate?[]:sceneLines());
        prev.disabled=animate||index===0;
        next.disabled=animate;
        next.textContent=index===scenes.length-1?'Start understanding test':'Next';
        if(animate)showNextLine();
    }
    prev.addEventListener('click',()=>{if(!settledCurrent||index===0)return;index--;render(false);window.scrollTo({top:0,behavior:'smooth'});});
    next.addEventListener('click',()=>{if(!settledCurrent)return;if(index<scenes.length-1){index++;render(true);window.scrollTo({top:0,behavior:'smooth'});}else{document.querySelector('.otree-btn-next').click();}});
    document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&!prev.disabled)prev.click();if(e.key==='ArrowRight')next.click();});
    render(true);
})();
</script>
{{ endblock }}
