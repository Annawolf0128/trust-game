{{ block title }}{{ endblock }}

{{ block content }}
<style>
    :root{--ink:#0d1215;--stage:#232a33;--panel:#313d46;--blue:#74b9f5;--orange:#ffad58;--green:#61cf93;--yellow:#ffd166;--white:#f7f9fb}
    html,body{width:100%;min-height:100%;margin:0!important;background:var(--ink)!important}
    body>.container,.otree-body.container,.otree-body,main.container{max-width:none!important;width:100%!important;min-height:100vh!important;margin:0!important;padding:0!important;background:var(--ink)!important}.otree-title,.page-header{display:none!important}
    .survey-shell{color:var(--white);font-family:Inter,Arial,sans-serif;background:var(--ink);min-height:100vh;border-radius:0;overflow:visible}
    .survey-head{height:74px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:2px solid #252e35}.survey-pill{background:var(--blue);color:#102131;border-radius:28px;padding:12px 26px;font-size:23px;font-weight:900}.survey-title{font-size:27px;font-weight:850;flex:1}.survey-count{font-size:18px;font-weight:800;color:#cbd4db}
    .survey-stage{height:505px;margin:18px 24px 14px;background:var(--stage);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}.survey-scene{text-align:center;animation:fade .5s ease both}.survey-icon{width:180px;margin:auto;border:5px solid var(--yellow);border-radius:25px;padding:26px;background:#29343c;animation:rise .7s ease both}.check-line{height:14px;background:#63717c;border-radius:10px;margin:18px 0;position:relative}.check-line:before{content:'✓';position:absolute;left:-10px;top:-20px;color:var(--green);font-size:35px;font-weight:950}.survey-main{font-size:55px;color:var(--yellow);font-weight:950;margin-top:34px}.survey-sub{font-size:24px;font-weight:900;margin-top:18px}.survey-sub.account-summary{font-size:34px;margin-top:26px}.survey-sub.account-summary strong{font-size:40px}
    .survey-sentence{min-height:104px;margin:0 42px;background:var(--panel);border-radius:20px;border-left:10px solid var(--blue);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 34px;font-size:25px;line-height:1.35;font-weight:900;animation:drop .65s ease both}.survey-sentence.is-hidden{display:none}.survey-controls{display:flex;justify-content:flex-end;gap:18px;margin:18px 38px}.survey-btn{min-width:166px;border-radius:15px;padding:16px 25px;border:3px solid #6c7a86;background:#36424c;color:var(--white);font-size:22px;font-weight:900}.survey-btn.primary{background:var(--blue);border-color:var(--blue);color:#102131}.survey-btn:disabled{opacity:.28}.otree-btn-next{display:none!important}
    @keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:none}}@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
</style>
<div class="survey-shell">
    <div class="survey-head"><div class="survey-pill">FINAL PART</div><div class="survey-title" id="survey-title"></div><div class="survey-count" id="survey-count"></div></div>
    <div class="survey-stage" id="survey-stage"></div>
    <div class="survey-sentence" id="survey-sentence"></div>
    <div class="survey-controls"><button type="button" class="survey-btn" id="survey-prev">Previous</button><button type="button" class="survey-btn primary" id="survey-next">Next</button></div>
</div>
{{ next_button }}
<script>
(function(){
 const steps=[
  {title:'Part 2 is complete',visual:'<div class="survey-scene"><div class="survey-main">Part 2 complete</div><div class="survey-sub account-summary">Your Part 2 accumulated account: <strong style="color:var(--green)">{{ part2_account }}</strong></div></div>',text:''},
  {title:'Final survey',visual:'<div class="survey-scene"><div class="survey-icon"><div class="check-line"></div><div class="check-line"></div><div class="check-line"></div></div><div class="survey-main">Final survey</div></div>',text:'The final part is a short survey. Your answers are confidential and do not affect your payment.'},
  {title:'Ready to begin',visual:'<div class="survey-scene"><div class="survey-main">Almost finished</div><div class="survey-sub">Please answer every survey question.</div></div>',text:'Select “Start survey” when you are ready.'}
 ];
 let i=0;const title=document.getElementById('survey-title'),count=document.getElementById('survey-count'),stage=document.getElementById('survey-stage'),sentence=document.getElementById('survey-sentence'),prev=document.getElementById('survey-prev'),next=document.getElementById('survey-next');
 function render(){const s=steps[i];title.textContent=s.title;count.textContent=`Instruction ${i+1} of ${steps.length}`;stage.innerHTML=s.visual;sentence.textContent=s.text;sentence.classList.toggle('is-hidden',!s.text);prev.disabled=i===0;next.textContent=i===steps.length-1?'Start survey':'Next';}
 prev.addEventListener('click',()=>{if(i>0){i--;render();}});next.addEventListener('click',()=>{if(i<steps.length-1){i++;render();}else{document.querySelector('.otree-btn-next').click();}});render();
})();
</script>
{{ endblock }}
